name: Desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a draft for this version after all downloads pass (e.g. v0.1.0)'
        type: string
        required: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ startsWith(matrix.target, 'darwin-') && (github.event_name == 'push' || inputs.release_tag != '') && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        target: &targets [darwin-arm64, darwin-amd64, linux-amd64, linux-arm64, windows-amd64]
        include: &desktops
          # Upstream v0.42.0 release asset SHA-256 digests.
          - target: darwin-arm64
            runner: macos-15
            digest: 493da3585e66c5da677a4be39402faf2041b4e45a61eb456e4547eca753a544e
            ext: zip
          - target: darwin-amd64
            runner: macos-15-intel
            digest: ef7b96cf59de5714a7493a696e9db141a85a99459620b00c42cb3bad14be2af2
            ext: zip
          - target: linux-amd64
            runner: ubuntu-22.04
            digest: b87688fa2e19cee7d813cad7fd7dadb71dff3198e47125aba66ba4af5e490438
            ext: tar.gz
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            digest: f2f3f863e63728b87772e7306bd6030df6e6c89773a7082eb0122113cf9e453d
            ext: tar.gz
          - target: windows-amd64
            runner: windows-2022
            digest: 2698c3ade60d536bec71c8bb645350e264000ef59e62223588ba822b51187fc1
            ext: zip
    env:
      GOTOOLCHAIN: local
      TINYGO_SHA256: ${{ matrix.digest }}
      ARCHIVE: dist/mtile-${{ matrix.target }}.${{ matrix.ext }}
    steps:
      - name: Validate release version
        if: github.event_name == 'push' || inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a version such as v0.1.0' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build and virtual display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xvfb xauth xdotool
      - name: Package desktop archive
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.os == 'macOS' && (github.event_name == 'push' || inputs.release_tag != '') && 'candidate' || 'dist' }}
        run: sh scripts/release/build-bundle.sh "$PACKAGE_DIR"
      - name: Sign, notarize and staple the macOS release download
        if: runner.os == 'macOS' && (github.event_name == 'push' || inputs.release_tag != '')
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
          MTILE_MACOS_CERTIFICATE_P12: ${{ secrets.MTILE_MACOS_CERTIFICATE_P12 }}
          MTILE_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MTILE_MACOS_CERTIFICATE_PASSWORD }}
          MTILE_MACOS_NOTARY_KEY_P8: ${{ secrets.MTILE_MACOS_NOTARY_KEY_P8 }}
          MTILE_MACOS_NOTARY_KEY_ID: ${{ secrets.MTILE_MACOS_NOTARY_KEY_ID }}
          MTILE_MACOS_NOTARY_ISSUER_ID: ${{ secrets.MTILE_MACOS_NOTARY_ISSUER_ID }}
        run: bash scripts/release/sign-macos-release.sh "candidate/${ARCHIVE##*/}" dist "${TAG#v}"
      - name: Launch, edit and export with the network disabled (macOS)
        if: runner.os == 'macOS'
        run: sandbox-exec -p '(version 1) (allow default) (deny network*)' python3 scripts/release/verify_download.py "$ARCHIVE" --launch --audio-digest "$ARCHIVE.audio-digest"
      - name: Launch, edit and export with the network disabled (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo unshare --net -- sudo -u "$(id -un)" xvfb-run -a \
            "$(command -v python3)" scripts/release/verify_download.py "$ARCHIVE" --launch --audio-digest "$ARCHIVE.audio-digest"
          gui_args=()
          if [[ "$(uname -m)" == aarch64 ]]; then gui_args+=(--reopen-edited); fi
          sudo unshare --net -- sudo -u "$(id -un)" \
            "$(command -v python3)" scripts/release/verify_linux_gui.py "$ARCHIVE" "${gui_args[@]}" --failure-frame "$RUNNER_TEMP/coin-quest.xwd"
      - name: Save the Linux editor screen if its GUI check fails
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gui-failure-${{ matrix.target }}
          path: ${{ runner.temp }}/coin-quest.xwd
          if-no-files-found: ignore
          retention-days: 3
      - name: Enable outbound firewall rules on the disposable Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
      - name: Launch, edit and export with outbound connections blocked (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/release/verify_download.py "$ARCHIVE" --launch --block-windows-network --audio-digest "$ARCHIVE.audio-digest"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-digest-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}.audio-digest
          overwrite: true
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mtile-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          compression-level: 0
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  catalog:
    name: Offline examples (${{ matrix.target }}, group ${{ matrix.shard }})
    needs: desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: *targets
        shard: [0, 1, 2, 3]
        include: *desktops
    env:
      ARCHIVE: candidate/mtile-${{ matrix.target }}.${{ matrix.ext }}
      TARGET: ${{ matrix.target }}
      SHARD: ${{ matrix.shard }}
      REPORT: results/${{ matrix.target }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: mtile-${{ matrix.target }}
          path: candidate
      - name: Enable Windows Firewall
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
      - name: Build each packaged example three times with empty caches
        shell: bash
        run: |
          args=(scripts/release/verify_catalog.py "$ARCHIVE" --target "$TARGET" --shard "$SHARD" --output "$REPORT")
          case "$RUNNER_OS" in
            Linux) sudo unshare --net -- sudo -u "$(id -un)" "$(command -v python3)" "${args[@]}" ;;
            macOS) sandbox-exec -p '(version 1) (allow default) (deny network*)' python3 "${args[@]}" ;;
            Windows) python "${args[@]}" --block-windows-network ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-hashes-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ env.REPORT }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  compare-catalog:
    name: Compare all 300 offline ROM builds
    needs: catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-hashes-*
          path: results
      - name: Require the same SHA-256 for every build of each example
        run: |
          python3 scripts/release/compare_catalog.py results --summary "$GITHUB_STEP_SUMMARY" \
            --archive-checksums archives.sha256 --example-checksums examples.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: verified-checksums
          path: |
            archives.sha256
            examples.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  reproducibility:
    name: Compare imported-audio ROMs across all five desktops
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: audio-digest-*
          merge-multiple: true
      - name: Require one SHA-256 for every target
        working-directory: digests
        run: |
          files=(*.audio-digest)
          test "${#files[@]}" -eq 5
          for file in "${files[@]}"; do
            digest=$(cat "$file")
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "$digest" "$file"
            cmp "${files[0]}" "$file"
          done

  draft:
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs: [reproducibility, compare-catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: mtile-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: verified-checksums
          path: checked
      - name: Verify and attach downloads to a draft
        working-directory: downloads
        run: |
          sha256sum --strict -c ../checked/archives.sha256
          sha256sum -c ./*.zip.sha256 ./*.tar.gz.sha256
          cp ../checked/examples.sha256 .
          # matching-refs returns an empty list for a new tag and can also return
          # longer names with this prefix. Check the exact ref and peel tag objects.
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG")
          object=$(jq -c --arg ref "refs/tags/$TAG" '.[] | select(.ref == $ref) | .object' <<< "$refs")
          tag_args=(--target "$GITHUB_SHA")
          if [[ -n "$object" ]]; then
            while [[ "$(jq -r .type <<< "$object")" == tag ]]; do
              object=$(gh api "repos/$GH_REPO/git/tags/$(jq -r .sha <<< "$object")" --jq '.object')
            done
            if [[ "$(jq -r .type <<< "$object")" != commit || "$(jq -r .sha <<< "$object")" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $TAG points to a different revision." >&2
              exit 1
            fi
            tag_args=(--verify-tag)
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "Pushed tag $TAG is no longer present." >&2
            exit 1
          fi
          if release=$(gh release view "$TAG" --json isDraft,assets,targetCommitish); then
            jq -e .isDraft <<< "$release" > /dev/null
            if [[ -z "$object" && "$(jq -r .targetCommitish <<< "$release")" != "$GITHUB_SHA" ]]; then
              echo "Existing draft $TAG targets a different revision." >&2
              exit 1
            fi
            # A rerun can fill a partial draft without replacing signed assets.
            missing=()
            for asset in *.zip *.tar.gz *.sha256; do
              if jq -e --arg f "$asset" '.assets | any(.name == $f)' <<< "$release" > /dev/null; then
                remote=$(jq -r --arg f "$asset" '.assets[] | select(.name == $f) | .digest' <<< "$release")
                if [ "$remote" != "sha256:$(sha256sum "$asset" | cut -d' ' -f1)" ]; then
                  echo "The draft already has a different $asset. Existing downloads were preserved." >&2
                  exit 1
                fi
              else
                missing+=("$asset")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then gh release upload "$TAG" "${missing[@]}"; fi
          else
            gh release create "$TAG" "${tag_args[@]}" --draft --title "Mtile $TAG" \
              --notes 'Extract the archive for your desktop and open Mtile to play Coin Quest. The download includes the examples, Go, TinyGo and the preview player. Download examples.sha256 from this release to verify the ROMs built from the 20 standalone examples. The bundled README includes commands for Linux, macOS and Windows. The Mac packages have a Developer ID Application signature and a stapled Apple notarization ticket.' \
              ./*.zip ./*.tar.gz ./*.sha256
          fi
