---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Ebitengine (used by the editor) needs X11/GL/ALSA headers on Linux.
      # https://ebitengine.org/en/documents/install.html
      - name: Install Ebitengine build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config xvfb

      - name: Test CLI module (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./...

      - name: Test CLI module (macOS)
        if: runner.os == 'macOS'
        run: go test ./...

      - name: Test runtime module
        run: go test ./...
        working-directory: runtime

      # Build-tag matrix for the compile-time Mode 0 state shapes. These are
      # intentionally focused because the ordinary framebuffer tests are a
      # different linked renderer and must not run under mtile_mode0.
      - name: Test Mode 0 runtime matrix
        working-directory: runtime
        run: |
          go test -tags=mtile_mode0,mtile_mode0_layers0,mtile_mode0_obj,mtile_mode0_text .
          go test -tags=mtile_mode0 .
          go test -tags=mtile_mode0,mtile_mode0_text .
          go test -tags=mtile_mode0,mtile_mode0_layers2 .
          go test -tags=mtile_mode0,mtile_mode0_layers3 .
          go test -tags=mtile_mode0,mtile_mode0_layers4 .
          go test -tags=mtile_mode0,mtile_mode0_obj .
          go test -tags=mtile_mode0,mtile_mode0_obj,mtile_mode0_text .
          go test -tags=mtile_mode0,mtile_mode0_obj,mtile_mode0_objpack .
          go test -tags=mtile_mode0,mtile_mode0_obj,mtile_mode0_text,mtile_mode0_objpack .
          go test -tags=mtile_mode0,mtile_mode0_layers2,mtile_mode0_obj,mtile_mode0_objpack .

      # One-second fuzz smoke for the strict PSG-only asset/runtime boundaries.
      - name: Audio v2 fuzz smoke (Linux)
        if: runner.os == 'Linux'
        run: scripts/audio/fuzz_smoke.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Ebitengine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Check audio conformance harness syntax
        run: |
          sh -n scripts/audio/*.sh
          python3 -m py_compile scripts/audio/*.py
          python3 -m unittest discover -s scripts/audio -p '*_test.py'

      - name: go vet (CLI module)
        run: go vet ./...

      - name: go vet (runtime module)
        run: go vet ./...
        working-directory: runtime

      - name: golangci-lint (CLI module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: golangci-lint (runtime module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: runtime

  rom:
    name: ROM build (TinyGo)
    runs-on: ubuntu-latest
    env:
      TINYGO_VERSION: "0.41.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install TinyGo
        run: |
          wget -q \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          sudo dpkg -i "tinygo_${TINYGO_VERSION}_amd64.deb"
          tinygo version

      - name: Install headless renderer benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Build pinned headless mGBA helper
        run: |
          cmake -S cmd/mtile-player -B /tmp/mtile-player-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_QT=OFF -DBUILD_SDL=OFF \
            -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF \
            -DUSE_DISCORD_RPC=OFF -DUSE_FFMPEG=OFF -DUSE_LIBZIP=OFF \
            -DUSE_SQLITE3=OFF -DUSE_LZMA=OFF -DUSE_EPOXY=OFF \
            -DUSE_MINIZIP=OFF -DUSE_ZLIB=OFF
          cmake --build /tmp/mtile-player-build --target mtile-player --config Release

      # Full pipeline smoke: Lua + strict four-channel assets -> generated Go
      # -> TinyGo -> .gba. Legacy PICO and PCM fixtures are intentionally not
      # release inputs for Audio v2.
      - name: Build examples
        run: |
          go run ./cmd/mtile build -o /tmp/hello.gba examples/hello/
          go run ./cmd/mtile build -o /tmp/color.gba examples/color/
          go run ./cmd/mtile build \
            -o /tmp/background-layers.gba examples/background-layers/
          go run ./cmd/mtile build \
            -o /tmp/audio-gb-melody.gba examples/audio-gb-melody/
          go run ./cmd/mtile build \
            -o /tmp/audio-gb-song.gba examples/audio-gb-song/
          go run ./cmd/mtile build \
            -o /tmp/audio-gb-editor.gba examples/audio-gb-editor/

      # The same cartridge must link through every public renderer policy.
      # AUTO is asserted by the CLI report in unit tests; this matrix catches
      # build-tag/resource regressions in the actual TinyGo links.
      - name: Build renderer matrix
        run: |
          go run ./cmd/mtile build -renderer mode4 -o /tmp/testio-mode4.gba examples/testio/
          go run ./cmd/mtile build -renderer mode0 -o /tmp/testio-mode0.gba examples/testio/
          go run ./cmd/mtile build -renderer auto -o /tmp/testio-auto.gba examples/testio/

      # Paired, frame-synchronized semantic/performance gate on the actual
      # mGBA core. A mismatch or a missed-frame/cycle/memory regression fails.
      - name: Paired Mode 4 / Mode 0 mGBA gate
        run: >-
          go run ./cmd/renderbench
          -project examples/testio
          -player /tmp/mtile-player-build/mtile-player
          -out /tmp/renderer-report
          -warmup 8
          -samples 30

      # Evidence-backed AUTO shapes beyond the static-map vertical slice.
      # Runtime fset is intentionally absent: tile-v1 keeps that measured
      # sub-20%-win shape on Mode 4 and its selector behavior is unit-tested.
      - name: Paired Mode 0 workload matrix
        run: |
          for workload in zero_bg_text camera composite layers2 dynamic_sprite_frames inactive_sprite_slots pack16 pack32 oam64 sset16 mset16; do
            go run ./cmd/renderbench \
              -project examples/testio \
              -source "cmd/renderbench/testdata/workloads/${workload}.lua" \
              -player /tmp/mtile-player-build/mtile-player \
              -out "/tmp/renderer-report-${workload}" \
              -warmup 8 \
              -samples 30
          done

      # Boundary characterization: Mode 4 cannot deliver this deliberately
      # overloaded 38x32px-OBJ frame, while Mode 0 remains comfortably within
      # its frame budget. Keep exact pixels as the live gate and lock the
      # measured speedup/headroom with performance_evidence_test.go.
      - name: Paired Mode 0 scanline boundary
        run: >-
          go run ./cmd/renderbench
          -project examples/testio
          -source cmd/renderbench/testdata/workloads/scanline38.lua
          -player /tmp/mtile-player-build/mtile-player
          -out /tmp/renderer-characterization-scanline38
          -warmup 8
          -samples 30
          -gate parity

      # Migration baselines need exact pixels. Frame delivery and resource
      # measurements remain in each report but do not widen AUTO's separately
      # evidence-backed full performance profile.
      - name: Paired graphics-model characterization
        run: |
          for workload in layers4 parallax_layers map_arities_short map_arities_long map_mutation_isolation object_order_current object_depth_lanes; do
            go run ./cmd/renderbench \
              -project examples/background-layers \
              -source "cmd/renderbench/testdata/workloads/${workload}.lua" \
              -player /tmp/mtile-player-build/mtile-player \
              -out "/tmp/renderer-characterization-${workload}" \
              -warmup 8 \
              -samples 30 \
              -gate parity
          done

      # Cover more than two foreground repeats. A unit test exhausts the full
      # 1,920-tick common period; this real mGBA capture proves its early wraps.
      # One cumulative Mode 0 miss is the initial cold upload, and movement
      # must not add another through coincident layer boundaries.
      - name: Background-layers long cadence
        run: |
          go run ./cmd/renderbench \
            -project examples/background-layers \
            -player /tmp/mtile-player-build/mtile-player \
            -out /tmp/renderer-characterization-background-layers \
            -warmup 8 \
            -samples 520 \
            -gate parity
          mode0_misses="$(jq -r '.mode0.missedFrames' /tmp/renderer-characterization-background-layers/report.json)"
          test "$mode0_misses" -le 1

      # The zero-input teaching demo deterministically animates, awards one
      # coin, and settles on the used tile, so the paired capture covers the
      # complete current-API state transition as well as its performance.
      - name: Coin-block state transition
        run: |
          go run ./cmd/renderbench \
            -project examples/coin-block \
            -player /tmp/mtile-player-build/mtile-player \
            -out /tmp/renderer-report-coin-block \
            -warmup 8 \
            -samples 120

      - name: Upload renderer evidence
        uses: actions/upload-artifact@v4
        with:
          name: renderer-report
          path: |
            /tmp/renderer-report*
            /tmp/renderer-characterization-*

      # Fresh-project path a new user hits first.
      - name: Build a new project
        run: |
          go run ./cmd/mtile new /tmp/ci-game
          go run ./cmd/mtile build /tmp/ci-game

      # Build-pipeline tests that skip without TinyGo on PATH.
      - name: Test build pipeline with TinyGo
        run: go test ./internal/build/ ./cmd/mtile/

      # The active release gates link only CH1–CH4. Direct Sound/FIFO/PCM ROMs
      # remain archived research and are deliberately absent here.
      - name: Game Boy PSG ROMs (checked allocations)
        run: make smoke-gba audioref-gba audiopsg-gba audiopsgcoexist-gba
        working-directory: runtime

      # Compile generated graphics-only and all-audio packages with the same
      # -gc=none/-opt=2 policy and reject nonzero TinyGo allocation reports.
      - name: Generated package allocation gates
        run: >-
          go test ./internal/transpiler/
          -run 'TestGenerated(Game|AudioGame)CompilesWithTinyGo' -count=1
