name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'examples/README.md'
      - 'internal/build/templates/**'
      - 'internal/transpiler/transpiler.go'
      - 'internal/transpiler/render_modes.go'
      - 'fonts/JetBrainsMono/**'
      - 'runtime/third_party/aurora/**'
      - 'cmd/editor/assets/mtile-header.png'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'examples/README.md'
      - 'internal/build/templates/**'
      - 'internal/transpiler/transpiler.go'
      - 'internal/transpiler/render_modes.go'
      - 'fonts/JetBrainsMono/**'
      - 'runtime/third_party/aurora/**'
      - 'cmd/editor/assets/mtile-header.png'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check guide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned Markdown renderer
        run: python -m pip install -r website/requirements.txt
      - name: Build and check static pages
        run: python -m unittest discover -s website -p 'test_*.py'
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: mtile-guide
          path: website/_site/
          include-hidden-files: true
          if-no-files-found: error
