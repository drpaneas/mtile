<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img" aria-labelledby="title desc"><title id="title">PCM playback recheck: mTile and Butano</title><desc id="desc">Mean non-wait instruction work divided by a 561792-cycle 30 FPS update budget. Matched 32 mixer slots and 8 effect slots, identical bank, same mGBA core. Lower is better.</desc><rect width="100%" height="100%" fill="#fffdf6" rx="16"/><g font-family="Trebuchet MS,Segoe UI,sans-serif" fill="#42384f"><text x="28" y="38" font-size="24" fill="#42384f">PCM playback: the current comparison</text><text x="28" y="65" font-size="15" fill="#42384f">Non-wait instruction cycles / 30 FPS budget · lower is better</text><rect x="28" y="88" width="14.00" height="14" rx="3" fill="#6b5195"/><text x="50" y="101" font-size="15" fill="#42384f">mTile</text><rect x="258" y="88" width="14.00" height="14" rx="3" fill="#45674d"/><text x="280" y="101" font-size="15" fill="#42384f">Butano · matched 32 / 8</text><text x="28" y="153" font-size="15" fill="#42384f">One short WAV</text><rect x="240" y="138" width="43.13" height="16" rx="3" fill="#6b5195"/><text x="291.1307257252981" y="151" font-size="13" fill="#42384f">5.07%</text><rect x="240" y="160" width="42.15" height="16" rx="3" fill="#45674d"/><text x="290.14898040555937" y="173" font-size="13" fill="#42384f">4.96%</text><text x="28" y="229" font-size="15" fill="#42384f">4 music voices</text><rect x="240" y="214" width="99.48" height="16" rx="3" fill="#6b5195"/><text x="347.4750595712767" y="227" font-size="13" fill="#42384f">11.70%</text><rect x="240" y="236" width="96.58" height="16" rx="3" fill="#45674d"/><text x="344.57603614861017" y="249" font-size="13" fill="#42384f">11.36%</text><text x="28" y="305" font-size="15" fill="#42384f">16 music voices</text><rect x="240" y="290" width="268.94" height="16" rx="3" fill="#6b5195"/><text x="516.9422209050088" y="303" font-size="13" fill="#42384f">31.64%</text><rect x="240" y="312" width="258.37" height="16" rx="3" fill="#45674d"/><text x="506.36971245585556" y="325" font-size="13" fill="#42384f">30.40%</text><text x="28" y="381" font-size="15" fill="#42384f">32 music voices</text><rect x="240" y="366" width="494.89" height="16" rx="3" fill="#6b5195"/><text x="742.8876179558745" y="379" font-size="13" fill="#42384f">58.22%</text><rect x="240" y="388" width="474.09" height="16" rx="3" fill="#45674d"/><text x="722.0946141988494" y="401" font-size="13" fill="#42384f">55.78%</text><text x="28" y="457" font-size="15" fill="#42384f">4 voices + 8 effects</text><rect x="240" y="442" width="142.84" height="16" rx="3" fill="#6b5195"/><text x="390.84434244939996" y="455" font-size="13" fill="#42384f">16.81%</text><rect x="240" y="464" width="143.39" height="16" rx="3" fill="#45674d"/><text x="391.3854270501064" y="477" font-size="13" fill="#42384f">16.87%</text><text x="28" y="533" font-size="15" fill="#42384f">10-second WAV</text><rect x="240" y="518" width="48.46" height="16" rx="3" fill="#6b5195"/><text x="296.4618408592504" y="531" font-size="13" fill="#42384f">5.70%</text><rect x="240" y="540" width="47.71" height="16" rx="3" fill="#45674d"/><text x="295.70619048805725" y="553" font-size="13" fill="#42384f">5.61%</text><text x="28" y="620" font-size="13" fill="#42384f">All 25 configurations: two 600-update captures each, every gap = two LCD refreshes.</text></g></svg>
