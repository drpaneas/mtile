<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" role="img" aria-labelledby="title desc"><title id="title">CPU execution before and after event pacing</title><desc id="desc">Percentage of emulated time spent executing instructions, including intentional polling. New mTile and Butano use the same corrected core. This is not a power measurement.</desc><rect width="100%" height="100%" fill="#fffdf6" rx="16"/><g font-family="Trebuchet MS,Segoe UI,sans-serif" fill="#42384f"><text x="28" y="37" font-size="24" fill="#42384f">Let the CPU wait without running a loop</text><text x="28" y="65" font-size="15" fill="#42384f">All executed instruction cycles / elapsed time · same audio · 30 FPS target</text><rect x="28" y="85" width="14.00" height="14" rx="3" fill="#92662f"/><text x="50" y="98" font-size="15" fill="#42384f">Before: mTile</text><rect x="268" y="85" width="14.00" height="14" rx="3" fill="#6b5195"/><text x="290" y="98" font-size="15" fill="#42384f">After: mTile</text><rect x="508" y="85" width="14.00" height="14" rx="3" fill="#45674d"/><text x="530" y="98" font-size="15" fill="#42384f">Butano 32 / 8</text><text x="28" y="154" font-size="15" fill="#42384f">No audio</text><rect x="240" y="140" width="580.00" height="13" rx="3" fill="#92662f"/><text x="828.0" y="151" font-size="12" fill="#42384f">100.00%</text><rect x="240" y="159" width="6.56" height="13" rx="3" fill="#6b5195"/><text x="254.55580713146503" y="170" font-size="12" fill="#42384f">1.13%</text><text x="28" y="228" font-size="15" fill="#42384f">One WAV</text><rect x="240" y="214" width="578.11" height="13" rx="3" fill="#92662f"/><text x="826.1127878882813" y="225" font-size="12" fill="#42384f">99.67%</text><rect x="240" y="233" width="30.30" height="13" rx="3" fill="#6b5195"/><text x="278.30083732057415" y="244" font-size="12" fill="#42384f">5.22%</text><rect x="240" y="252" width="28.94" height="13" rx="3" fill="#45674d"/><text x="276.94424982911823" y="263" font-size="12" fill="#42384f">4.99%</text><text x="28" y="302" font-size="15" fill="#42384f">4 music voices</text><rect x="240" y="288" width="578.11" height="13" rx="3" fill="#92662f"/><text x="826.1077290764791" y="299" font-size="12" fill="#42384f">99.67%</text><rect x="240" y="307" width="68.72" height="13" rx="3" fill="#6b5195"/><text x="316.7185140882509" y="318" font-size="12" fill="#42384f">11.85%</text><rect x="240" y="326" width="66.09" height="13" rx="3" fill="#45674d"/><text x="314.08521658341374" y="337" font-size="12" fill="#42384f">11.39%</text><text x="28" y="376" font-size="15" fill="#42384f">16 music voices</text><rect x="240" y="362" width="578.10" height="13" rx="3" fill="#92662f"/><text x="826.1041741427432" y="373" font-size="12" fill="#42384f">99.67%</text><rect x="240" y="381" width="184.35" height="13" rx="3" fill="#6b5195"/><text x="432.35493005715045" y="392" font-size="12" fill="#42384f">31.79%</text><rect x="240" y="400" width="176.50" height="13" rx="3" fill="#45674d"/><text x="424.5028661977558" y="411" font-size="12" fill="#42384f">30.43%</text><text x="28" y="450" font-size="15" fill="#42384f">32 music voices</text><rect x="240" y="436" width="578.10" height="13" rx="3" fill="#92662f"/><text x="826.0967673962117" y="447" font-size="12" fill="#42384f">99.67%</text><rect x="240" y="455" width="338.53" height="13" rx="3" fill="#6b5195"/><text x="586.5282249183565" y="466" font-size="12" fill="#42384f">58.37%</text><rect x="240" y="474" width="323.75" height="13" rx="3" fill="#45674d"/><text x="571.7515500313323" y="485" font-size="12" fill="#42384f">55.82%</text><text x="28" y="524" font-size="15" fill="#42384f">4 music + 8 effects</text><rect x="240" y="510" width="578.11" height="13" rx="3" fill="#92662f"/><text x="826.1065039043276" y="521" font-size="12" fill="#42384f">99.67%</text><rect x="240" y="529" width="98.38" height="13" rx="3" fill="#6b5195"/><text x="346.38056801568314" y="540" font-size="12" fill="#42384f">16.96%</text><rect x="240"