<svg xmlns="http://www.w3.org/2000/svg" width="940" height="390" viewBox="0 0 940 390" role="img" aria-labelledby="title desc"><title id="title">Frame events survive long mixer interrupts</title><desc id="desc">The old main loop missed a visible interval while the mixer ran. A remembered LCD event lets the new main loop resume without adding a refresh.</desc><rect width="100%" height="100%" fill="#fffdf6" rx="16"/><g font-family="Trebuchet MS,Segoe UI,sans-serif" fill="#42384f"><text x="28" y="37" font-size="23" fill="#42384f">Remember the frame event, even when mixing runs long</text><text x="28" y="66" font-size="15" fill="#42384f">The mixer still starts at line 0. The renderer keeps its VBlank transfer guards.</text><text x="28" y="131" font-size="18" fill="#42384f">Before</text><rect x="165" y="105" width="70.00" height="43" rx="3" fill="#92662f"/><text x="187" y="132" font-size="18" fill="#fffdf6">A</text><rect x="243" y="105" width="70.00" height="43" rx="3" fill="#92662f"/><text x="265" y="132" font-size="18" fill="#fffdf6">A</text><rect x="321" y="105" width="70.00" height="43" rx="3" fill="#b9aecb"/><text x="343" y="132" font-size="18" fill="#42384f">B</text><rect x="399" y="105" width="70.00" height="43" rx="3" fill="#b9aecb"/><text x="421" y="132" font-size="18" fill="#42384f">B</text><rect x="477" y="105" width="70.00" height="43" rx="3" fill="#b9aecb"/><text x="499" y="132" font-size="18" fill="#42384f">B</text><rect x="555" y="105" width="70.00" height="43" rx="3" fill="#92662f"/><text x="577" y="132" font-size="18" fill="#fffdf6">C</text><rect x="633" y="105" width="70.00" height="43" rx="3" fill="#92662f"/><text x="655" y="132" font-size="18" fill="#fffdf6">C</text><rect x="711" y="105" width="70.00" height="43" rx="3" fill="#b9aecb"/><text x="733" y="132" font-size="18" fill="#42384f">D</text><rect x="789" y="105" width="70.00" height="43" rx="3" fill="#b9aecb"/><text x="811" y="132" font-size="18" fill="#42384f">D</text><text x="875" y="132" font-size="18" fill="#6d6378">…</text><text x="165" y="169" font-size="13" fill="#42384f">One box = one LCD refresh. One letter = one rendered game image.</text><text x="28" y="226" font-size="18" fill="#42384f">After</text><rect x="165" y="200" width="70.00" height="43" rx="3" fill="#6b5195"/><text x="187" y="227" font-size="18" fill="#fffdf6">A</text><rect x="243" y="200" width="70.00" height="43" rx="3" fill="#6b5195"/><text x="265" y="227" font-size="18" fill="#fffdf6">A</text><rect x="321" y="200" width="70.00" height="43" rx="3" fill="#b9aecb"/><text x="343" y="227" font-size="18" fill="#42384f">B</text><rect x="399" y="200" width="70.00" height="43" rx="3" fill="#b9aecb"/><text x="421" y="227" font-size="18" fill="#42384f">B</text><rect x="477" y="200" width="70.00" height="43" rx="3" fill="#6b5195"/><text x="499" y="227" font-size="18" fill="#fffdf6">C</text><rect x="555" y="200" width="70.00" height="43" rx="3" fill="#6b5195"/><text x="577" y="227" font-size="18" fill="#fffdf6">C</text><rect x="633" y="200" width="70.00" height="43" rx="3" fill="#b9aecb"/><text x="655" y="227" font-size="18" fill="#42384f">D</text><rect x="711" y="200" width="70.00" height="43" rx="3" fill="#b9aecb"/><text x="733" y="227" font-size="18" fill="#42384f">D</text><rect x="789" y="200" width="70.00" height="43" rx="3" fill="#6b5195"/><text x="811" y="227" font-size="18" fill="#fffdf6">E</text><text x="875" y="227" font-size="18" fill="#6d6378">…</text><text x="165" y="264" font-size="13" fill="#42384f">One box = one LCD refresh. One letter = one rendered game image.</text><text x="28" y="332" font-size="14" fill="#42384f">Original 32-voice capture: 598 two-refresh intervals + 1 three-refresh interval.</text><text x="28" y="359" font-size="14" fill="#42384f">New capture: all 599 intervals have two refreshes. Same result in both independent repeats.</text></g></svg>
