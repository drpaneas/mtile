<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc"><title id="title">Useful work and waiting are different</title><desc id="desc">With four music voices, mTile actively polls during intentional waits. Butano spends most remaining time HALTed. This comparison does not measure battery life.</desc><rect width="100%" height="100%" fill="#fffdf6" rx="16"/><g font-family="Trebuchet MS,Segoe UI,sans-serif" fill="#42384f"><text x="28" y="38" font-size="24" fill="#42384f">A small workload can still keep the CPU awake</text><text x="28" y="115" font-size="15" fill="#42384f">mTile</text><rect x="170" y="95" width="80.91" height="28" rx="3" fill="#6b5195"/><rect x="250.9063081472621" y="95" width="616.81" height="28" rx="3" fill="#b9aecb"/><rect x="867.7162247474748" y="95" width="0.00" height="28" rx="3" fill="#d9d3e0"/><rect x="867.7162247474748" y="95" width="2.28" height="28" rx="3" fill="#6d6378"/><text x="170" y="146" font-size="13" fill="#42384f">Work 11.56% · polling 88.12% · HALT/events 0.00% · non-HALT events 0.33%</text><text x="28" y="200" font-size="15" fill="#42384f">Butano</text><rect x="170" y="180" width="79.54" height="28" rx="3" fill="#45674d"/><rect x="249.53622133528728" y="180" width="0.22" height="28" rx="3" fill="#b9aecb"/><rect x="249.75802001446488" y="180" width="619.97" height="28" rx="3" fill="#d9d3e0"/><rect x="869.7246955046207" y="180" width="0.28" height="28" rx="3" fill="#6d6378"/><text x="170" y="231" font-size="13" fill="#42384f">Work 11.36% · polling 0.03% · HALT/events 88.57% · non-HALT events 0.04%</text><text x="28" y="294" font-size="15" fill="#42384f">Primary CPU tables exclude deliberate waits. Polling still executes instructions; HALT pauses them.</text></g></svg>
