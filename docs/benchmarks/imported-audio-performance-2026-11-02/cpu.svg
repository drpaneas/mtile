<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="title desc"><title id="title">Imported audio: CPU instruction work</title><desc id="desc">Measured CPU instruction cycles excluding deliberate waits, as a percentage of the 561792-cycle 30 FPS budget. Hardware event advancement is separate.</desc><rect width="100%" height="100%" fill="#fffdf6" rx="16"/><g font-family="Trebuchet MS,Segoe UI,sans-serif" fill="#42384f"><text x="28" y="38" font-size="24" fill="#42384f">Same audio, measured on the emulated ARM7</text><text x="28" y="65" font-size="15" fill="#42384f">Instruction work / 30 FPS budget · lower is better · PCM output ≈15.77 kHz</text><rect x="28" y="86" width="14.00" height="14" rx="3" fill="#6b5195"/><text x="50" y="99" font-size="15" fill="#42384f">mTile</text><rect x="253" y="86" width="14.00" height="14" rx="3" fill="#45674d"/><text x="275" y="99" font-size="15" fill="#42384f">Butano 32 / 8</text><rect x="478" y="86" width="14.00" height="14" rx="3" fill="#92662f"/><text x="500" y="99" font-size="15" fill="#42384f">Butano 20 / 4</text><text x="28" y="158" font-size="15" fill="#42384f">One WAV (half duty)</text><rect x="250" y="145" width="39.42" height="14" rx="3" fill="#6b5195"/><text x="298.4155369484317" y="157" font-size="13" fill="#42384f">4.93%</text><rect x="250" y="165" width="39.67" height="14" rx="3" fill="#45674d"/><text x="298.66962861699704" y="177" font-size="13" fill="#42384f">4.96%</text><rect x="250" y="185" width="38.62" height="14" rx="3" fill="#92662f"/><text x="297.6217247664616" y="197" font-size="13" fill="#42384f">4.83%</text><text x="28" y="235" font-size="15" fill="#42384f">10-second WAV</text><rect x="250" y="222" width="44.43" height="14" rx="3" fill="#6b5195"/><text x="303.4334415584416" y="234" font-size="13" fill="#42384f">5.55%</text><rect x="250" y="242" width="44.90" height="14" rx="3" fill="#45674d"/><text x="303.8999439887598" y="254" font-size="13" fill="#