<svg xmlns="http://www.w3.org/2000/svg" width="920" height="385" viewBox="0 0 920 385" role="img" aria-labelledby="title desc"><title id="title">RAM is not the sound file</title><desc id="desc">EWRAM and IWRAM are separate memory banks. The mTile stack reservation is shown separately. Debug mailbox is 512 bytes in both and is excluded.</desc><rect width="100%" height="100%" fill="#fffdf6" rx="16"/><g font-family="Trebuchet MS,Segoe UI,sans-serif" fill="#42384f"><text x="28" y="36" font-size="24" fill="#42384f">Where the RAM goes: four-voice music</text><text x="28" y="63" font-size="15" fill="#42384f">KiB · static data + code in RAM · 512-byte debug mailbox excluded</text><text x="28" y="108" font-size="15" fill="#42384f">mTile</text><rect x="250" y="96" width="132.33" height="18" rx="3" fill="#6b5195"/><text x="390.328125" y="111" font-size="13" fill="#42384f">11.03 KiB EWRAM</text><rect x="250" y="124" width="91.83" height="18" rx="3" fill="#6b5195"/><rect x="341.828125" y="124" width="108.00" height="18" rx="3" fill="#b9aecb"/><text x="457.828125" y="139" font-size="13" fill="#42384f">7.65 KiB IWRAM + 9 KiB reserved stacks</text><text x="28" y="190" font-size="15" fill="#42384f">Butano 32 / 8</text><rect x="250" y="178" width="408.84" height="18" rx="3" fill="#45674d"/><text x="666.84375" y="193" font-size="13" fill="#42384f">34.07 KiB EWRAM</text><rect x="250" y="206" width="124.50" height="18" rx="3" fill="#45674d"/><text x="382.5" y="221" font-size="13" fill="#42384f">10.38 KiB IWRAM</text><text x="28" y="272" font-size="15" fill="#42384f">Butano 20 / 4</text><rect x="250" y="260" width="392.72" height="18" rx="3" fill="#92662f"/><text x="650.71875" y="275" font-size="13" fill="#42384f">32.73 KiB EWRAM</text><rect x="250" y="288" width="124.50" height="18" rx="3" fill="#92662f"/><text x="382.5" y="303" font-size="13" fill="#42384f">10.38 KiB IWRAM</text><text x="28" y="365" font-size="13" fill="#42384f">Butano uses stacks above its static sections; it also needs stack RAM. Observed peaks are in the report.</text></g></svg>
